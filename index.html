    <script src="/theme-init.js"></script>
    <script>
      // Apply the stored text-size scale before first paint to avoid layout shift.
      (function () {
        try {
          var map = { xs: 0.88, s: 0.95, m: 1, l: 1.15, xl: 1.35 };
          var step = localStorage.getItem('testament_font_scale_step');
          var scale = step && map[step] ? map[step] : 1;
          document.documentElement.style.setProperty('--app-font-scale', String(scale));
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
    <title>Testament — The Living Word</title>
