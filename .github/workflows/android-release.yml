name: Build & Release Android APK / AAB (TWA)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configure Android SDK & Bubblewrap
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          sudo ln -sf $ANDROID_HOME/cmdline-tools/latest/bin $ANDROID_HOME/bin || true
          sudo ln -sf $ANDROID_HOME/cmdline-tools/latest $ANDROID_HOME/tools || true
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF
          bubblewrap doctor

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          python3 -c "import os, base64; open('/tmp/testament-release.keystore', 'wb').write(base64.b64decode(os.environ['KEYSTORE_BASE64'].strip()))"
          ls -lh /tmp/testament-release.keystore

      - name: Build Signed APK & AAB
        working-directory: twa
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          bubblewrap build --skipPwaValidation --signingKeyPath=/tmp/testament-release.keystore --signingKeyAlias="${{ secrets.KEY_ALIAS }}"
          mv app-release-signed.apk "testament-${GITHUB_REF_NAME}.apk"
          mv app-release-bundle.aab "testament-${GITHUB_REF_NAME}.aab"

      - name: Clean Keystore Temp File
        if: always()
        run: rm -f /tmp/testament-release.keystore

      - name: Upload Release APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: testament-android-release
          path: |
            twa/testament-*.apk
            twa/testament-*.aab

      - name: Attach APK & AAB to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            twa/testament-*.apk
            twa/testament-*.aab
          generate_release_notes: true

